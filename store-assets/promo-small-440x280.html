<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReturnPilot — Small Promo Tile 440x280</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 440px;
            height: 280px;
            overflow: hidden;
            background: linear-gradient(135deg, #f8fbff 0%, #edf5ff 40%, #e0effe 75%, #f1f7fe 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #0f172a;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px 14px 20px;
        }

        /* Ambient Glow & Radial Mesh */
        .bg-glow-top {
            position: absolute;
            top: -70px;
            left: 50%;
            transform: translateX(-50%);
            width: 380px;
            height: 180px;
            background: radial-gradient(ellipse, rgba(37, 99, 235, 0.12) 0%, rgba(59, 130, 246, 0.05) 50%, transparent 75%);
            filter: blur(30px);
            pointer-events: none;
        }

        .bg-glow-bottom {
            position: absolute;
            bottom: -80px;
            right: -60px;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.12) 0%, rgba(37, 99, 235, 0.04) 50%, transparent 70%);
            filter: blur(35px);
            pointer-events: none;
        }

        /* Decorative Fluid Waves SVG */
        .wave-svg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px;
            pointer-events: none;
            z-index: 0;
            opacity: 0.75;
        }

        /* Top Pill */
        .top-pill {
            z-index: 10;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid #cfe2fe;
            padding: 4px 12px;
            border-radius: 9999px;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.08);
            backdrop-filter: blur(8px);
        }

        .top-pill .pulse-dot {
            width: 6px;
            height: 6px;
            background: #2563eb;
            border-radius: 50%;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.22);
        }

        .top-pill-text {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 9.5px;
            font-weight: 800;
            color: #1d4ed8;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        /* Main Hero Branding */
        .hero-main {
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-top: -2px;
        }

        .logo-box {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
        }

        .logo-img {
            width: 54px;
            height: auto;
            display: block;
        }

        .brand-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 29px;
            font-weight: 900;
            letter-spacing: -0.04em;
            line-height: 1.05;
            color: #021a4e;
        }

        .brand-title .brand-accent {
            background: linear-gradient(135deg, #2563eb 0%, #0284c7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-subtitle {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 12px;
            font-weight: 700;
            color: #334155;
            letter-spacing: -0.01em;
            margin-top: 4px;
        }

        /* Bottom Formats Bar */
        .bottom-card {
            z-index: 10;
            width: 100%;
            background: #ffffff;
            border: 1px solid #dbeafe;
            border-radius: 12px;
            padding: 7px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 24px -4px rgba(15, 23, 42, 0.08), 0 2px 6px rgba(0, 0, 0, 0.02);
        }

        .format-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            color: #0f172a;
        }

        .format-icon-mini {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 800;
            color: #ffffff;
            flex-shrink: 0;
        }

        .format-badge.json .format-icon-mini {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            box-shadow: 0 2px 6px rgba(37, 99, 235, 0.35);
        }

        .format-badge.pdf .format-icon-mini {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            box-shadow: 0 2px 6px rgba(239, 68, 68, 0.35);
        }

        .format-badge.excel .format-icon-mini {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 2px 6px rgba(16, 185, 129, 0.35);
        }

        .divider {
            width: 1px;
            height: 16px;
            background: #e2e8f0;
        }
    </style>
</head>

    <div class="bg-glow-bottom"></div>
